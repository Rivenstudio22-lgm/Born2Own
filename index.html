<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BORN2OWN | Luxury Streetwear</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            background: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            width: 100%;
        }

        header {
            padding: 20px 4%;
            background: rgba(0,0,0,0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 4%;
        }

        .hero img {
            width: 100%;
            display: block;
        }

        .section-label {
            font-size: 0.75rem;
            letter-spacing: 8px;
            color: #888;
            text-transform: uppercase;
            margin: 50px 0 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 12px;
        }

        .gallery-item {
            height: 520px;
            overflow: hidden;
            position: relative;
            background: #111;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 1.2s;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        footer {
            padding: 60px 4%;
            text-align: center;
            font-size: 0.65rem;
            color: #666;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <header>
        <span style="font-weight:900; font-size:0.65rem; letter-spacing:5px; color:#888;">NASCIDO PARA POSSUIR</span>
        <img src="logoazul.jpeg" alt="BORN2OWN" height="45">
        <button onclick="navigateTo('about')" style="background:none; border:1px solid #fff; color:#fff; padding:10px 25px; font-weight:900; cursor:pointer;">SOBRE NÓS</button>
    </header>

    <div class="container">
        <div class="hero">
            <img src="thebest.jpeg" alt="Hero Image">
        </div>

        <span class="section-label">Selected Pieces</span>
        
        <div class="gallery-grid">
            <div class="gallery-item"><img src="supercap.jpeg" alt=""></div>
            <div class="gallery-item"><img src="manigue.jpeg" alt=""></div>
            <div class="gallery-item"><img src="amalaentao.jpeg" alt=""></div>
            <div class="gallery-item"><img src="mota.jpeg" alt=""></div>
            <div class="gallery-item"><img src="desenho.jpeg" alt=""></div>
            <div class="gallery-item"><img src="celldeherton.jpeg" alt=""></div>
            
            <!-- Nova imagem que enviaste -->
            <div class="gallery-item"><img src="LT3WY" alt="Born2Own Collage"></div>
            
            <!-- Aqui podes adicionar as outras duas imagens que faltam -->
            <!-- <div class="gallery-item"><img src="nome-da-imagem1.jpg" alt=""></div> -->
            <!-- <div class="gallery-item"><img src="nome-da-imagem2.jpg" alt=""></div> -->
        </div>
    </div>

    <footer>
        MAPUTO, MOZAMBIQUE • EST. 2026 • BORN2OWN OFFICIAL
    </footer>

    <script>
        function navigateTo(page) {
            if (page === 'about') {
                alert("Página Sobre Nós em breve...");
            }
        }
    </script>
</body>
</html>
