<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BORN2OWN | Luxury Streetwear</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #000000;
            --accent: #ffffff;
            --gray: #1a1a1a;
            --text-muted: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body { 
            background-color: var(--bg); 
            color: var(--accent); 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden;
            width: 100%;
        }

        /* HEADER */
        header { 
            padding: 20px 4%; 
            background: rgba(0,0,0,0.95); 
            backdrop-filter: blur(15px);
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid var(--gray);
        }
        header img { height: 45px; filter: brightness(1.2); }
        
        .nav-link { 
            background: none;
            cursor: pointer;
            color: var(--accent); 
            font-size: 0.7rem; 
            letter-spacing: 3px; 
            font-weight: 900;
            border: 1px solid var(--accent);
            padding: 10px 25px;
            transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .nav-link:hover { background: var(--accent); color: var(--bg); }

        /* HERO SECTION */
        .hero { width: 100%; padding: 0; margin: 0; text-align: center; background: #000; }
        .hero-banner { width: 100%; overflow: hidden; border-bottom: 1px solid var(--gray); display: flex; justify-content: center; }
        .hero-banner img { 
            width: 100%; 
            max-height: 85vh; 
            object-fit: contain; 
            display: block; 
            transition: 1.5s transform; 
        }
        .hero-banner:hover img { transform: scale(1.02); }

        .hero-text { padding: 60px 4%; text-align: left; }
        .hero-text h1 { font-family: 'Cinzel', serif; font-size: clamp(2rem, 5vw, 4rem); letter-spacing: 10px; margin-bottom: 40px; }
        
        .btn-shop { 
            background: var(--accent); 
            color: var(--bg); 
            padding: 22px 60px; 
            font-weight: 900; 
            text-decoration: none; 
            text-transform: uppercase; 
            letter-spacing: 4px;
            font-size: 0.8rem;
            transition: 0.5s;
            display: inline-block;
        }
        .btn-shop:hover { letter-spacing: 8px; background: #e0e0e0; }

        /* SEÇÃO DE PRODUTOS PRINCIPAL */
        .section-label { font-size: 0.7rem; letter-spacing: 8px; color: var(--text-muted); text-transform: uppercase; margin: 50px 4%; display: block; }
        
        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 40px; 
            padding: 0 4%; 
            width: 100%;
            background: var(--bg);
        }
        
        .gallery-item { 
            background: var(--bg); 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            width: 100%; 
        }
        
        .gallery-item img { 
            width: 100%; 
            height: 500px; 
            max-height: 75vh; 
            object-fit: contain; 
            background: #050505; 
            filter: grayscale(10%); 
            transition: 1.5s cubic-bezier(0.19, 1, 0.22, 1); 
        }
        .gallery-item:hover img { transform: scale(1.02); filter: grayscale(0%); }
        
        .item-details {
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gray);
        }
        .item-details h3 { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 400; }

        /* TELA SOBRE NÓS (ESTILO INTERFACE YOUTUBE - CAMADA EM SOBREPOSIÇÃO) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); /* Fundo translúcido para ver a app original por trás */
            backdrop-filter: blur(20px); /* Efeito cinemático de desfoque */
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transform: translateY(100%); /* Efeito de deslizar nativo */
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.4s ease;
            overflow-y: auto; 
        }
        
        .modal-overlay.active { 
            opacity: 1; 
            pointer-events: auto; 
            transform: translateY(0); 
        }

        .close-btn {
            position: fixed;
            top: 30px; right: 4%;
            background: rgba(0,0,0,0.8); 
            backdrop-filter: blur(5px);
            border: 1px solid var(--accent);
            color: var(--accent); 
            font-size: 0.7rem;
            letter-spacing: 3px;
            font-weight: 900;
            cursor: pointer;
            padding: 12px 24px;
            text-transform: uppercase;
            z-index: 2100;
            transition: 0.3s;
        }
        .close-btn:hover { background: var(--accent); color: var(--bg); }

        /* CONTEÚDO EXTRAÍDO EXATAMENTE DO SEU CÓDIGO ORIGINAL */
        .modal-content-wrapper {
            width: 100%;
            padding-bottom: 100px;
        }

        /* Banner sem cortes laterais (ocupa 100% da largura) */
        .modal-full-banner {
            width: 100%;
            max-height: 75vh;
            object-fit: contain;
            display: block;
            background: #000;
            border-bottom: 1px solid #111;
        }

        .modal-body-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        .modal-body-section h2 {
            font-family: 'Cinzel', serif;
            letter-spacing: 6px;
            font-size: 2.2rem;
            margin-bottom: 25px;
        }

        .modal-body-section p {
            font-size: 1rem;
            color: #b3b3b3;
            line-height: 1.8;
            font-weight: 300;
            margin-bottom: 40px;
        }

        .modal-display-img {
            width: 100%;
            max-width: 700px;
            max-height: 70vh;
            object-fit: contain;
            margin: 20px auto 40px auto;
            display: block;
            border: 1px solid #222;
        }

        footer { padding: 80px 4%; border-top: 1px solid var(--gray); font-size: 0.6rem; letter-spacing: 4px; color: var(--text-muted); text-align: center; margin-top: 80px; }

        /* WHATSAPP */
        .wpp { position: fixed; bottom: 40px; right: 40px; background: #ffffff; width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 1000; transition: 0.5s; mix-blend-mode: difference; text-decoration: none; }
        .wpp:hover { transform: scale(1.2); }
        .wpp svg { width: 25px; height: 25px; fill: #000000; }
    </style>
</head>
<body>

    <header>
        <span style="font-weight: 900; font-size: 0.65rem; letter-spacing: 5px; text-transform: uppercase; color: var(--text-muted);">Nascido para Possuir</span>
        <img src="logoazul.jpeg" alt="B2O">
        <button class="nav-link" onclick="toggleModal()">SOBRE NÓS</button>

    <main>
        <section class="hero">
            <div class="hero-banner">
                <img src="thebest.jpeg" alt="Collection">
            </div>
            <div class="hero-text">
                <h1>BORN2OWN</h1>
                <a href="https://wa.me" target="_blank" class="btn-shop">Shop WhatsApp</a>

        </section>

        <span class="section-label">Selected Pieces</span>
        
        <section class="gallery-grid">
            <div class="gallery-item">

                <div class="item-details"><h3>Hats Selection</h3></div>
            </div>
            <div class="gallery-item">
                <img src="manigue.jpeg" alt="Manigue">
                <div class="item-details"><h3>Manigue Series</h3></div>
            </div>
            <div class="gallery-item">
                <img src="amalaentao.jpeg" alt="Amala">
                <div class="item-details"><h3>Amala Collection</h3></div>
            </div>
            <div class="gallery-item">
                <img src="mota.jpeg" alt="Street">
                <div class="item-details"><h3>Street Lifestyle</h3></div>
            </div>
            <div class="gallery-item">
                <img src="desenho.jpeg" alt="Art">
                <div class="item-details"><h3>Concept Art</h3></div>
            </div>
        </section>
    </main>

    <!-- PAINEL SUBRE NÓS INTEGRADO (ESTILO IN-APP SEM FECHAR A APLICAÇÃO) -->
    <div class="modal-overlay" id="aboutModal">
        <button class="close-btn" onclick="toggleModal()">Fechar</button>
        <div class="modal-content-wrapper">
            
            <!-- Banner sem cortes laterais vindo do seu código original -->
            <img src="thebest.jpeg" alt="Full Banner" class="modal-full-banner">

            <div class="modal-body-section">
                <h2>BORN2OWN</h2>
