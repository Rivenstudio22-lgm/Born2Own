<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BORN2OWN | Luxury Streetwear</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        header {
            padding: 20px 15px;
            background: rgba(0,0,0,0.98);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .hero img, .gallery-item img {
            width: 100%;
            display: block;
        }

        .section-label {
            font-size: 0.75rem;
            letter-spacing: 8px;
            color: #888;
            text-transform: uppercase;
            margin: 40px 0 15px 15px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
        }

        .gallery-item {
            height: 480px;
            overflow: hidden;
            background: #111;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 1.2s;
        }

        footer {
            padding: 40px 15px;
            text-align: center;
            font-size: 0.65rem;
            color: #555;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <header>
        <span style="font-weight:900; font-size:0.65rem; letter-spacing:5px; color:#888;">NASCIDO PARA POSSUIR</span>
        <img src="logoazul.jpeg" alt="BORN2OWN" height="45">
        <button onclick="navigateTo('about')" style="background:none; border:1px solid white; color:white; padding:10px 20px; font-weight:900; cursor:pointer; font-size:0.75rem;">SOBRE NÓS</button>
    </header>

    <div class="main-container">
        <div class="hero">
            <img src="thebest.jpeg" alt="Hero">
        </div>

        <span class="section-label">SELECTED PIECES</span>
        
        <div class="gallery-grid">
            <div class="gallery-item"><img src="supercap.jpeg" alt=""></div>
            <div class="gallery-item"><img src="manigue.jpeg" alt=""></div>
            <div class="gallery-item"><img src="amalaentao.jpeg" alt=""></div>
            <div class="gallery-item"><img src="mota.jpeg" alt=""></div>
            <div class="gallery-item"><img src="desenho.jpeg" alt=""></div>
            <div class="gallery-item"><img src="celldeherton.jpeg" alt=""></div>
            <div class="gallery-item"><img src="LT3WY" alt="Collage"></div>
            <!-- Adiciona aqui as outras duas imagens -->
            <!-- <div class="gallery-item"><img src="imagem8.jpeg" alt=""></div> -->
        </div>
    </div>

    <footer>
        MAPUTO, MOZAMBIQUE • EST. 2026 • BORN2OWN
    </footer>

    <script>
        function navigateTo() {
            alert("Página Sobre Nós em breve...");
        }
    </script>
</body>
</html>
